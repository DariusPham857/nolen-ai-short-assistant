<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1140 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title-dark arch-desc-dark" id="nolen-architecture-dark-root">
      <title id="arch-title-dark">AI Short Film Production Assistant Architecture</title>
      <desc id="arch-desc-dark">Topology diagram illustrating the client ingress, local workstation monolith (Next.js App, Postgres 16, Async Worker, StorageAdapter), and external AI media provider orchestration.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #nolen-architecture-dark-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #nolen-architecture-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #nolen-architecture-dark-root .desc { font-size: 0.88rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 820px;
      line-height: 1.45; }</style>
        <pattern id="nolen-architecture-dark-dots-dark" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.10"/>
        </pattern>
        <marker id="nolen-architecture-dark-arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="nolen-architecture-dark-arrow-accent-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="nolen-architecture-dark-arrow-link-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#nolen-architecture-dark-dots-dark)" opacity="0.65"/>

      <!-- Zones (Painted before arrows and nodes) -->
      <!-- Zone 1: Ingress -->
      <rect x="40" y="84" width="180" height="392" rx="8"
            fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.12"/>
      <rect x="76" y="88" width="108" height="12" rx="2" fill="#2d3142"/>
      <text x="130" y="97" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CLIENT &amp; INGRESS</text>

      <!-- Zone 2: Local Workstation Monolith -->
      <rect x="250" y="84" width="570" height="392" rx="8"
            fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.12"/>
      <rect x="385" y="88" width="300" height="12" rx="2" fill="#2d3142"/>
      <text x="535" y="97" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">LOCAL WORKSTATION (DOCKER / LOCALHOST)</text>

      <!-- Zone 3: Downstream & Runtimes -->
      <rect x="850" y="84" width="250" height="392" rx="8"
            fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.12"/>
      <rect x="885" y="88" width="180" height="12" rx="2" fill="#2d3142"/>
      <text x="975" y="97" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">DOWNSTREAM &amp; RUNTIMES</text>

      <!-- Arrows / Connectors (Painted behind nodes) -->
      <!-- 1. Producer UI -> Next.js & Hono API (Orthogonal elbow right+up) -->
      <path d="M 200,260 H 232 Q 240,260 240,252 V 166 Q 240,158 248,158 H 280"
            fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#nolen-architecture-dark-arrow-link-dark)"/>

      <!-- 2. Next.js -> PostgreSQL 16 DB (Straight horizontal, accent stroke) -->
      <line x1="490" y1="158" x2="580" y2="158" stroke="#f08a59" stroke-width="1.4" marker-end="url(#nolen-architecture-dark-arrow-accent-dark)"/>

      <!-- 3. Next.js -> StorageAdapter (Straight vertical) -->
      <line x1="350" y1="196" x2="350" y2="340" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#nolen-architecture-dark-arrow-dark)"/>

      <!-- 4. PostgreSQL -> Async Worker (Straight vertical, jobs dispatch) -->
      <line x1="650" y1="196" x2="650" y2="340" stroke="#f08a59" stroke-width="1.2" marker-end="url(#nolen-architecture-dark-arrow-accent-dark)"/>

      <!-- 5. Async Worker -> PostgreSQL (Straight vertical dashed, ledger settlement) -->
      <line x1="710" y1="340" x2="710" y2="196" stroke="#bfc0c0" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#nolen-architecture-dark-arrow-dark)"/>

      <!-- 6. Async Worker -> StorageAdapter (Straight horizontal) -->
      <line x1="580" y1="378" x2="490" y2="378" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#nolen-architecture-dark-arrow-dark)"/>

      <!-- 7. Async Worker -> AI Providers Gateway (Orthogonal elbow right+up) -->
      <path d="M 790,360 H 827 Q 835,360 835,352 V 166 Q 835,158 843,158 H 880"
            fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#nolen-architecture-dark-arrow-link-dark)"/>

      <!-- 8. Async Worker -> FFmpeg CLI Engine (Straight horizontal) -->
      <line x1="790" y1="388" x2="880" y2="388" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#nolen-architecture-dark-arrow-dark)"/>

      <!-- Connector Label Masks & Text (Painted before nodes, clear of all bounds) -->
      <!-- Label 1: HTTP / :3000 -->
      <rect x="205" y="203" width="70" height="12" rx="2" fill="#2d3142"/>
      <text x="240" y="212" fill="#739fdf" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP / :3000</text>

      <!-- Label 2: RESERVE &amp; SQL -->
      <rect x="503" y="148" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="535" y="157" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESERVE &amp; SQL</text>

      <!-- Label 3: STREAM MEDIA -->
      <rect x="312" y="262" width="76" height="12" rx="2" fill="#2d3142"/>
      <text x="350" y="271" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STREAM MEDIA</text>

      <!-- Label 4: PG-BOSS JOBS -->
      <rect x="615" y="248" width="70" height="12" rx="2" fill="#2d3142"/>
      <text x="650" y="257" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PG-BOSS JOBS</text>

      <!-- Label 5: SETTLE LEDGER -->
      <rect x="672" y="278" width="76" height="12" rx="2" fill="#2d3142"/>
      <text x="710" y="287" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SETTLE LEDGER</text>

      <!-- Label 6: PERSIST ASSET -->
      <rect x="498" y="372" width="74" height="12" rx="2" fill="#2d3142"/>
      <text x="535" y="381" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERSIST ASSET</text>

      <!-- Label 7: DISPATCH API -->
      <rect x="798" y="253" width="74" height="12" rx="2" fill="#2d3142"/>
      <text x="835" y="262" fill="#739fdf" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH API</text>

      <!-- Label 8: SPAWN CLI -->
      <rect x="805" y="382" width="60" height="12" rx="2" fill="#2d3142"/>
      <text x="835" y="391" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN CLI</text>

      <!-- Nodes -->
      <!-- Node 1: Producer UI -->
      <rect x="60" y="236" width="140" height="76" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.22"/>
      <rect x="68" y="244" width="28" height="12" rx="2" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.06" stroke-opacity="0.20"/>
      <text x="82" y="253" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="130" y="268" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Producer UI</text>
      <text x="130" y="284" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:3000</text>
      <text x="130" y="298" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Three-Pane Studio</text>

      <!-- Node 2: Next.js & Hono API -->
      <rect x="280" y="120" width="210" height="76" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.22"/>
      <rect x="288" y="128" width="28" height="12" rx="2" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.06" stroke-opacity="0.20"/>
      <text x="302" y="137" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="385" y="152" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next.js &amp; Hono API</text>
      <text x="385" y="168" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">App Router · Route Handlers</text>
      <text x="385" y="182" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Story Planner · Budget Guard</text>

      <!-- Node 3: PostgreSQL 16 DB (FOCAL NODE - ACCENT) -->
      <rect x="580" y="120" width="210" height="76" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.5" fill-opacity="0.10"/>
      <rect x="588" y="128" width="24" height="12" rx="2" fill="#f5f5f5" stroke="#f08a59" stroke-width="0.8" fill-opacity="0.06"/>
      <text x="600" y="137" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="685" y="152" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL 16 DB</text>
      <text x="685" y="168" fill="#f08a59" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Drizzle ORM · pg-boss</text>
      <text x="685" y="182" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Cost Ledger · State Machines</text>

      <!-- Node 4: StorageAdapter -->
      <rect x="280" y="340" width="210" height="76" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.22"/>
      <rect x="288" y="348" width="48" height="12" rx="2" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.06" stroke-opacity="0.20"/>
      <text x="312" y="357" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORAGE</text>
      <text x="385" y="372" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StorageAdapter</text>
      <text x="385" y="388" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">./data/assets &amp; ./exports</text>
      <text x="385" y="402" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SHA-256 Verified Media</text>

      <!-- Node 5: Async Media Worker -->
      <rect x="580" y="340" width="210" height="76" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.22"/>
      <rect x="588" y="348" width="44" height="12" rx="2" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.06" stroke-opacity="0.20"/>
      <text x="610" y="357" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
      <text x="685" y="372" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Media &amp; AI Worker</text>
      <text x="685" y="388" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Node.js Background Process</text>
      <text x="685" y="402" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Provider Engine · Live/Replay</text>

      <!-- Node 6: AI Providers Gateway -->
      <rect x="880" y="120" width="190" height="76" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.22"/>
      <rect x="888" y="128" width="36" height="12" rx="2" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.06" stroke-opacity="0.20"/>
      <text x="906" y="137" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT-AI</text>
      <text x="975" y="152" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Providers API</text>
      <text x="975" y="168" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gemini · Runway · fal.ai</text>
      <text x="975" y="182" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Keyframe &amp; Video Gen</text>

      <!-- Node 7: FFmpeg CLI Engine -->
      <rect x="880" y="340" width="190" height="76" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.22"/>
      <rect x="888" y="348" width="24" height="12" rx="2" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.06" stroke-opacity="0.20"/>
      <text x="900" y="357" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="975" y="372" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FFmpeg CLI Engine</text>
      <text x="975" y="388" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Local OS Binary Subprocess</text>
      <text x="975" y="402" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">9:16 Concat · Mix · Subtitle</text>
    </svg>
