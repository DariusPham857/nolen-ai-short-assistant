# FC-001: canonical localhost topology. Source: specs/film-creation/spec.md; CS-001: specs/compose-storage/spec.md
x-app: &app
  image: nolen-fc001:local
  environment: &env
    DATABASE_URL: postgresql://nolen:nolen_dev@db:5432/nolen_film
    EXECUTION_MODE: REPLAY
    STORAGE_BASE_PATH: /app/storage

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nolen
      POSTGRES_PASSWORD: nolen_dev
      POSTGRES_DB: nolen_film
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nolen -d nolen_film']
      interval: 5s
      timeout: 5s
      retries: 12
  migration:
    <<: *app
    command: [sh, -c, 'pnpm db:migrate && pnpm --filter @nolen/server db:seed']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  web:
    <<: *app
    build: .
    environment:
      <<: *env
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set OPERATOR_TOKEN to a random secret of at least 32 bytes}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media_storage:/app/storage
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: [pnpm, --filter, '@nolen/server', 'worker:start']
    volumes:
      - media_storage:/app/storage
    depends_on:
      migration:
        condition: service_completed_successfully
volumes:
  pgdata:
  media_storage:
