name: Film quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  film:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nolen
          POSTGRES_PASSWORD: nolen_ci
          POSTGRES_DB: nolen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nolen -d nolen_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://nolen:nolen_ci@127.0.0.1:5432/nolen_test
      EXECUTION_MODE: REPLAY
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Install and verify FFmpeg/FFprobe on runner
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: QG-CODE build (no operator secret)
        run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: QG-ARCH negative fixtures
        run: pnpm test:guardrails
      - name: QG-ARCH runtime and indirect server-only build
        run: pnpm --filter @nolen/web test:boundary
      - run: pnpm test:evidence
      - run: pnpm check:evidence
      - name: QG-INTEGRATION PostgreSQL 16 migrations, sessions, concurrency
        run: pnpm test:integration
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - name: QG-EVIDENCE production browser flows
        env:
          STORAGE_BASE_PATH: ${{ runner.temp }}/nolen-e2e-storage
        run: |
          # LP-AT-07 needs the real worker and the same media root as Playwright's web server.
          node servers/dist/worker/index.js > "$RUNNER_TEMP/nolen-e2e-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/nolen-e2e-worker.log"
              exit 1
            fi
            if grep -Fq '[worker] Ready and waiting for jobs.' "$RUNNER_TEMP/nolen-e2e-worker.log"; then
              pnpm test:e2e
              exit $?
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/nolen-e2e-worker.log"
          echo 'Worker readiness timed out'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-e2e-evidence
          path: |
            test-results/
            ${{ runner.temp }}/nolen-e2e-worker.log
      - name: Evidence scope
        if: always()
        run: |
          echo 'FC-001 create/read, SP-001 fixture/manual Story Approval, and FI-001 Financial Core checks. See individual step results.' >> "$GITHUB_STEP_SUMMARY"
          echo 'LP-AT-07 covers REPLAY keyframes and LIVE LOCAL_PAN_ZOOM media. Paid provider submission, provider-specific exactly-once, VIDEO_DISPATCH validation and benchmark export remain outside this evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Missing/skipped checks are not PASS; no G0–G5 release acceptance or branch protection claimed.' >> "$GITHUB_STEP_SUMMARY"
  compose:
    runs-on: ubuntu-latest
    env:
      OPERATOR_TOKEN: ci-only-operator-token-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Fresh localhost topology
        run: docker compose -p fc001-ci up --build --detach --wait --wait-timeout 180
      - name: Verify published port and worker independence
        run: |
          COMPOSE_PROJECT_NAME=fc001-ci node scripts/compose-smoke.mjs
      - name: Exact production-image media validation (test:media)
        run: |
          docker compose -p fc001-ci exec -T web pnpm --filter @nolen/server test:media
      - name: Logs
        if: failure()
        run: docker compose -p fc001-ci logs --tail 80
      - name: Cleanup test project
        if: always()
        run: docker compose -p fc001-ci down --volumes
